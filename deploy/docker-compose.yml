services:
  # ============ MySQL ============
  mysql:
    image: mysql:8.0
    container_name: cis-mysql
    environment:
      MYSQL_ROOT_PASSWORD: 123456
      MYSQL_DATABASE: study_abroad
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./mysql-init:/docker-entrypoint-initdb.d
    networks:
      - cis-network
    restart: always
    deploy:
      resources:
        limits:
          memory: 512M

  # ============ Spring Boot 后端 ============
  backend:
    build: ./backend
    container_name: cis-backend
    environment:
      MYSQL_HOST: mysql
      MYSQL_PASSWORD: 123456
    depends_on:
      - mysql
    networks:
      - cis-network
    restart: always
    deploy:
      resources:
        limits:
          memory: 512M

  # ============ Nginx 前端 ============
  frontend:
    build: ./frontend
    container_name: cis-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - cis-network
    restart: always
    deploy:
      resources:
        limits:
          memory: 64M

networks:
  cis-network:
    driver: bridge

volumes:
  mysql-data: